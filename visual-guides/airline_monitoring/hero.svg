<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">An outbound-flight change preserves the return itinerary</title><desc id="desc">An illustrative round trip shows an outbound flight replaced and the return flight preserved. A complete payload and passenger confirmation connect the original request with the checked booking.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ef5b24"/></marker></defs><rect width="900" height="420" fill="#f1f2ed"/><circle cx="45" cy="40" r="14" fill="#222321" stroke="#222321" stroke-width="2"/><text x="45" y="45" font-size="15" fill="#fff" text-anchor="middle" font-family="IBM Plex Mono,sans-serif">1</text><text x="68" y="47" font-size="21" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Read the request</text><circle cx="345" cy="40" r="14" fill="#222321" stroke="#222321" stroke-width="2"/><text x="345" y="45" font-size="15" fill="#fff" text-anchor="middle" font-family="IBM Plex Mono,sans-serif">2</text><text x="368" y="47" font-size="21" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Replace the itinerary</text><circle cx="650" cy="40" r="14" fill="#222321" stroke="#222321" stroke-width="2"/><text x="650" y="45" font-size="15" fill="#fff" text-anchor="middle" font-family="IBM Plex Mono,sans-serif">3</text><text x="673" y="47" font-size="21" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Check what stayed</text><text x="47" y="100" font-size="21" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Change the outbound flight.</text><text x="47" y="129" font-size="21" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Keep the return.</text><circle cx="62" cy="204" r="7" fill="#fff" stroke="#ef5b24" stroke-width="2"/><path d="M70 204L221 204" fill="none" stroke="#ef5b24" stroke-width="2"/><path d="M208 197L221 204L208 211" fill="none" stroke="#ef5b24" stroke-width="2"/><circle cx="234" cy="204" r="7" fill="#fff" stroke="#ef5b24" stroke-width="2"/><text x="81" y="187" font-size="18" fill="#ef5b24" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Outbound</text><circle cx="62" cy="274" r="7" fill="#fff" stroke="#222321" stroke-width="2"/><path d="M70 274L221 274" fill="none" stroke="#222321" stroke-width="2"/><path d="M208 267L221 274L208 281" fill="none" stroke="#222321" stroke-width="2"/><circle cx="234" cy="274" r="7" fill="#fff" stroke="#222321" stroke-width="2"/><text x="81" y="257" font-size="18" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Return</text><path d="M266 231H322" fill="none" stroke="#ef5b24" stroke-width="3" marker-end="url(#arrow)"/><path d="M347 114H534L558 138V323H347Z" fill="#fff" stroke="#222321" stroke-width="2"/><path d="M534 114V138H558" fill="none" stroke="#222321" stroke-width="2"/><text x="366" y="157" font-size="19" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Complete payload</text><path d="M365 172L538 172" fill="none" stroke="#222321" stroke-width="2"/><text x="366" y="208" font-size="19" fill="#ef5b24" text-anchor="start" font-family="IBM Plex Sans,sans-serif">New outbound</text><text x="366" y="254" font-size="19" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Original return</text><path d="M365 272H539" fill="none" stroke="#222321" stroke-width="1"/><text x="366" y="300" font-size="15" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Confirmation recorded</text><path d="M575 231H625" fill="none" stroke="#ef5b24" stroke-width="3" marker-end="url(#arrow)"/><circle cx="662" cy="204" r="7" fill="#fff" stroke="#ef5b24" stroke-width="2"/><path d="M670 204L824 204" fill="none" stroke="#ef5b24" stroke-width="2"/><circle cx="837" cy="204" r="7" fill="#fff" stroke="#ef5b24" stroke-width="2"/><text x="658" y="183" font-size="18" fill="#ef5b24" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Outbound changed</text><circle cx="662" cy="274" r="7" fill="#fff" stroke="#222321" stroke-width="2"/><path d="M670 274L824 274" fill="none" stroke="#222321" stroke-width="2"/><circle cx="837" cy="274" r="7" fill="#fff" stroke="#222321" stroke-width="2"/><text x="658" y="253" font-size="18" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Return preserved</text><text x="47" y="391" font-size="21" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">A successful update call can still produce the wrong booking.</text></svg>
