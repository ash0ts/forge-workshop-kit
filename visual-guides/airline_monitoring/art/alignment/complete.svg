ont-family="IBM Plex Mono" text-anchor="middle">O</text><text x="820" y="266" font-size="19" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">No issue</text><text x="1040" y="266" font-size="18" font-weight="400" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">Not run here</text><path d="M40,286L1160,286" fill="none" stroke="#b6b7af" stroke-width="1.5"/><text x="40" y="323" font-size="19" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Replace connection with nonstop</text><rect x="580" y="304" width="23" height="26" rx="0" fill="#e8e9e3" stroke="#242522" stroke-width="1.5"/><text x="591" y="324" font-size="16" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">A</text><rect x="608" y="304" width="23" height="26" rx="0" fill="#e8e9e3" stroke="#242522" stroke-width="1.5"/><text x="619" y="324" font-size="16" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">B</text><rect x="636" y="304" width="23" height="26" rx="0" fill="#e8e9e3" stroke="#242522" stroke-width="1.5"/><text x="647" y="324" font-size="16" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">R</text><path d="M665,317L690,317" fill="none" stroke="#242522" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="705" y="304" width="23" height="26" rx="0" fill="#f4f3ef" stroke="#242522" stroke-width="1.5"/><text x="716" y="324" font-size="16" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">N</text><rect x="733" y="304" width="23" height="26" rx="0" fill="#f4f3ef" stroke="#242522" stroke-width="1.5"/><text x="744" y="324" font-size="16" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">R</text><text x="820" y="323" font-size="19" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">No issue</text><text x="1040" y="323" font-size="18" font-weight="400" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">Not run here</text><path d="M40,343L1160,343" fill="none" stroke="#b6b7af" stroke-width="1.5"/><text x="40" y="380" font-size="19" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Explicit full-itinerary change</text><rect x="580" y="361" width="23" height="26" rx="0" fill="#e8e9e3" stroke="#242522" stroke-width="1.5"/><text x="591" y="381" font-size="16" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">O</text><rect x="608" y="361" width="23" height="26" rx="0" fill="#e8e9e3" stroke="#242522" stroke-width="1.5"/><text x="619" y="381" font-size="16" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">R</text><path d="M665,374L690,374" fill="none" stroke="#242522" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="705" y="361" width="23" height="26" rx="0" fill="#f4f3ef" stroke="#242522" stroke-width="1.5"/><text x="716" y="381" font-size="16" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">N</text><rect x="733" y="361" width="23" height="26" rx="0" fill="#f4f3ef" stroke="#242522" stroke-width="1.5"/><text x="744" y="381" font-size="16" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">N</text><text x="820" y="380" font-size="19" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">No issue</text><text x="1040" y="380" font-size="18" font-weight="400" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">Not run here</text><path d="M40,400L1160,400" fill="none" stroke="#b6b7af" stroke-width="1.5"/><text x="40" y="437" font-size="19" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Still waiting for confirmation</text><text x="580" y="437" font-size="17" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">No write yet</text><text x="820" y="437" font-size="19" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Unresolved</text><text x="1040" y="437" font-size="18" font-weight="400" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">Not run here</text><path d="M40,457L1160,457" fill="none" stroke="#b6b7af" stroke-width="1.5"/><text x="40" y="485" font-size="20" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Separate native qualification: six HTTP 500 responses</text><text x="40" y="516" font-size="18" font-weight="400" fill="#60625d" font-family="IBM Plex Mono" text-anchor="start">O / OUT = outbound    R = return    N = replacement</text><path d="M40,548L1160,548" fill="none" stroke="#b6b7af" stroke-width="1.5"/><text x="40" y="574" font-size="16" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">CODE</text><text x="130" y="574" font-size="17" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">criteria = &quot;Flag unrequested itinerary changes.&quot;</text><text x="750" y="574" font-size="16" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">OBSERVE</text><text x="750" y="599" font-size="19" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Six recorded native tests: HTTP 500.</text><text x="750" y="622" font-size="19" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">A missing judgment is not “no issue”.</text></svg>