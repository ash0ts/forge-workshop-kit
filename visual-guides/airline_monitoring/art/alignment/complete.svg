<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>Test the monitoring rule against reviewed turns</title><desc>Illustrative counterexamples • native status from recorded qualification</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#242522" stroke-width="1.4"/></marker></defs><rect x="0" y="0" width="1200" height="675" rx="0" fill="#f4f3ef" stroke="none" stroke-width="1.5"/><text x="40" y="28" font-size="16" font-weight="400" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">06 / Airline monitoring</text><text x="40" y="66" font-size="30" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Test the monitoring rule against reviewed turns</text><text x="1160" y="28" font-size="16" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="end">05/05</text><path d="M40,82L1160,82" fill="none" stroke="#b6b7af" stroke-width="1.5"/><text x="40" y="650" font-size="17" font-weight="400" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">Illustrative counterexamples • native status from recorded qualification</text><text x="40" y="117" font-size="24" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">A shorter itinerary is not always a mistake.</text><text x="40" y="158" font-size="17" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">REVIEWED REQUEST</text><text x="575" y="158" font-size="17" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">BEFORE → AFTER</text><text x="820" y="158" font-size="17" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">HUMAN</text><text x="1040" y="158" font-size="17" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">NATIVE</text><path d="M40,173L1