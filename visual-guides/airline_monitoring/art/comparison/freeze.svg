<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>Compare the agent and monitor on matching requests</title><desc>Recorded teaching view • see linked source records</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#242522" stroke-width="1.4"/></marker></defs><rect x="0" y="0" width="1200" height="675" rx="0" fill="#f4f3ef" stroke="none" stroke-width="1.5"/><text x="40" y="28" font-size="16" font-weight="400" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">06 / Airline monitoring</text><text x="40" y="66" font-size="30" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Compare the agent and monitor on matching requests</text><text x="1160" y="28" font-size="16" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="end">01/05</text><path d="M40,82L1160,82" fill="none" stroke="#b6b7af" stroke-width="1.5"/><text x="40" y="650" font-size="17" font-weight="400" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">Recorded teaching view • see linked source records</text><text x="40" y="118" font-size="23" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Agent correctness and monitor availability are different outcomes.</text><text x="40" y="166" font-size="18" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">ILLUSTRATIVE MATCHED BOOKING</text><path d="M110,211L520,211" fill="none" stroke="#242522" stroke-width="2"/><circle cx="110.0" cy="211" r="6" fill="#f4f3ef" stroke="#242522"/><text x="110.0" y="242" font-size="18" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">OUT-1</text><circle cx="315.0" cy="211" r="6" fill="#f4f3ef" stroke="#242522"/><text x="315.0" y="242" font-size="18" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">OUT-2</text><circle cx="520.0" cy="211" r="6" fill="#f4f3ef" stroke="#242522"/><text x="520.0" y="242" font-size="18" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">RETURN</text><path d="M310,252V302H120V315" fill="none" stroke="#242522" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310,302H715V315" fill="none" stroke="#242522" stroke-width="1.5" marker-end="url(#arrow)"/><text x="40" y="338" font-size="22" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Original agent</text><text x="640" y="338" font-size="22" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Repaired agent</text><text x="40" y="401" font-size="21" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Inspect the matched execution next.</text><text x="640" y="401" font-size="21" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Use an isolated copy of the same booking.</text><text x="40" y="477" font-size="23" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Compare requested changes and untouched flights.</text><text x="40" y="511" font-size="20" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Use the labeled omission drill to study the failure mechanism.</text><text x="680" y="178" font-size="18" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">MONITOR</text><text x="680" y="217" font-size="23" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Frozen criteria</text><path d="M680,238L1110,238" fill="none" stroke="#b6b7af" stroke-width="1.5"/><text x="680" y="260" font-size="21" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">Judging not yet inspected</text><text x="680" y="289" font-size="19" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Keep criteria fixed.</text><path d="M40,548L1160,548" fill="none" stroke="#b6b7af" stroke-width="1.5"/><text x="40" y="574" font-size="16" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">CODE</text><text x="130" y="574" font-size="17" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">before = run[&quot;initial_state&quot;][&quot;reservation&quot;]</text><text x="130" y="597" font-size="17" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">after = run[&quot;world&quot;][&quot;reservation&quot;]</text><text x="750" y="574" font-size="16" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">OBSERVE</text><text x="750" y="599" font-size="19" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Preserve successful live traffic.</text><text x="750" y="622" font-size="19" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Monitoring failures stay separate.</text></svg>