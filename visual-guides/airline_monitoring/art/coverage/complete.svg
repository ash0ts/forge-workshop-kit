<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>Count what the monitor has actually processed</title><desc>Illustrative teaching view • see linked source records</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#242522" stroke-width="1.4"/></marker></defs><rect x="0" y="0" width="1200" height="675" rx="0" fill="#f4f3ef" stroke="none" stroke-width="1.5"/><text x="40" y="28" font-size="16" font-weight="400" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">06 / Airline monitoring</text><text x="40" y="66" font-size="30" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Count what the monitor has actually processed</text><text x="1160" y="28" font-size="16" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="end">04/04</text><path d="M40,82L1160,82" fill="none" stroke="#b6b7af" stroke-width="1.5"/><text x="40" y="650" font-size="17" font-weight="400" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">Illustrative teaching view • see linked source records</text><text x="40" y="116" font-size="24" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Illustrative arithmetic: 8 eligible turns, 6 completed judgments</text><text x="40" y="157" font-size="17" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">TURN</text><text x="100" y="157" font-size="18" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">01</text><path d="M80,183H182L196,197V303H80Z" fill="#f4f3ef" stroke="#242522" stroke-width="1.5"/><path d="M182,183V197H196" fill="none" stroke="#242522" stroke-width="1"/><circle cx="135" cy="223" r="17" fill="#ec5b28" stroke="none"/><text x="135" y="230" font-size="22" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="middle">!</text><text x="135" y="279" font-size="16" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">flag</text><text x="135" y="336" font-size="17" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="middle">issue</text><text x="230" y="157" font-size="18" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">02</text><path d="M210,183H312L326,197V303H210Z" fill="#f4f3ef" stroke="#242522" stroke-width="1.5"/><path d="M312,183V197H326" fill="none" stroke="#242522" stroke-width="1"/><circle cx="265" cy="223" r="17" fill="#ec5b28" stroke="none"/><text x="265" y="230" font-size="22" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="middle">!</text><text x="265" y="279" font-size="16" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">flag</text><text x="265" y="336" font-size="17" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="middle">issue</text><text x="360" y="157" font-size="18" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">03</text><path d="M340,183H442L456,197V303H340Z" fill="#f4f3ef" stroke="#242522" stroke-width="1.5"/><path d="M442,183V197H456" fill="none" stroke="#242522" stroke-width="1"/><circle cx="395" cy="223" r="17" fill="#ec5b28" stroke="none"/><text x="395" y="230" font-size="22" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="middle">!</text><text x="395" y="279" font-size="16" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">flag</text><text x="395" y="336" font-size="17" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="middle">no issue</text><text x="490" y="157" font-size="18" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">04</text><path d="M470,183H572L586,197V303H470Z" fill="#f4f3ef" stroke="#242522" stroke-width="1.5"/><path d="M572,183V197H586" fill="none" stroke="#242522" stroke-width="1"/><circle cx="525" cy="223" r="17" fill="#e8e9e3" stroke="none"/><text x="525" y="230" font-size="22" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="middle">–</text><text x="525" y="279" font-size="16" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">clear</text><text x="525" y="336" font-size="17" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="middle">issue</text><text x="620" y="157" font-size="18" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">05</text><path d="M600,183H702L716,197V303H600Z" fill="#f4f3ef" stroke="#242522" stroke-width="1.5"/><path d="M702,183V197H716" fill="none" stroke="#242522" stroke-width="1"/><circle cx="655" cy="223" r="17" fill="#e8e9e3" stroke="none"/><text x="655" y="230" font-size="22" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="middle">–</text><text x="655" y="279" font-size="16" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">clear</text><text x="655" y="336" font-size="17" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="middle">no issue</text><text x="750" y="157" font-size="18" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">06</text><path d="M730,183H832L846,197V303H730Z" fill="#f4f3ef" stroke="#242522" stroke-width="1.5"/><path d="M832,183V197H846" fill="none" stroke="#242522" stroke-width="1"/><circle cx="785" cy="223" r="17" fill="#e8e9e3" stroke="none"/><text x="785" y="230" font-size="22" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="middle">–</text><text x="785" y="279" font-size="16" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">clear</text><text x="785" y="336" font-size="17" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="middle">no issue</text><text x="880" y="157" font-size="18" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">07</text><path d="M860,183H962L976,197V303H860Z" fill="#f4f3ef" stroke="#242522" stroke-width="1.5"/><path d="M962,183V197H976" fill="none" stroke="#242522" stroke-width="1"/><circle cx="915" cy="223" r="17" fill="#f4f3ef" stroke="#b6b7af"/><text x="915" y="230" font-size="22" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="middle">?</text><text x="915" y="279" font-size="16" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">pending</text><text x="915" y="336" font-size="17" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="middle">—</text><text x="1010" y="157" font-size="18" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">08</text><path d="M990,183H1092L1106,197V303H990Z" fill="#f4f3ef" stroke="#242522" stroke-width="1.5"/><path d="M1092,183V197H1106" fill="none" stroke="#242522" stroke-width="1"/><circle cx="1045" cy="223" r="17" fill="#f4f3ef" stroke="#b6b7af"/><text x="1045" y="230" font-size="22" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="middle">×</text><text x="1045" y="279" font-size="16" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">unavailable</text><text x="1045" y="336" font-size="17" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="middle">—</text><text x="40" y="336" font-size="16" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">HUMAN</text><path d="M87,355V367H834V355" fill="none" stroke="#242522" stroke-width="2"/><text x="87" y="398" font-size="22" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">6 completed judgments / 8 eligible turns</text><text x="917" y="397" font-size="22" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">75% coverage</text><path d="M40,425L1160,425" fill="none" stroke="#b6b7af" stroke-width="1.5"/><text x="40" y="465" font-size="25" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Precision = 2 / 3</text><text x="40" y="501" font-size="19" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Actual issues among 3 flagged turns</text><text x="640" y="465" font-size="25" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Recall = 2 / 3</text><text x="640" y="501" font-size="19" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Flagged issues among 3 reviewed issues</text><path d="M40,548L1160,548" fill="none" stroke="#b6b7af" stroke-width="1.5"/><text x="40" y="574" font-size="16" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">CODE</text><text x="130" y="574" font-size="17" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">coverage = len(completed) / len(eligible)</text><text x="130" y="597" font-size="17" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">precision = TP / (TP + FP)</text><text x="130" y="620" font-size="17" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">recall = TP / (TP + FN)</text><text x="750" y="574" font-size="16" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">OBSERVE</text><text x="750" y="599" font-size="19" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Keep pending and unavailable visible.</text><text x="750" y="622" font-size="19" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Agreement uses reviewed turns only.</text></svg>