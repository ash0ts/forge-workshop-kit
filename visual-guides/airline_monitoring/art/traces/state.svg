<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>Follow the passenger’s request through the write</title><desc>Illustrative teaching view • see linked source records</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#242522" stroke-width="1.4"/></marker></defs><rect x="0" y="0" width="1200" height="675" rx="0" fill="#f4f3ef" stroke="none" stroke-width="1.5"/><text x="40" y="28" font-size="16" font-weight="400" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">06 / Airline monitoring</text><text x="40" y="66" font-size="30" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Follow the passenger’s request through the write</text><text x="1160" y="28" font-size="16" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="end">03/04</text><path d="M40,82L1160,82" fill="none" stroke="#b6b7af" stroke-width="1.5"/><text x="40" y="650" font-size="17" font-weight="400" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">Illustrative teaching view • see linked source records</text><text x="40" y="119" font-size="23" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">One conversation, one booking, several operations</text><text x="40" y="152" font-size="18" font-weight="400" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">Illustrative trace anatomy • duration comes from stored timestamps</text><path d="M65,188L65,490" fill="none" stroke="#242522" stroke-width="2"/><circle cx="65" cy="202" r="7" fill="#f4f3ef" stroke="#242522"/><text x="90" y="197" font-size="16" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">PASSENGER</text><text x="90" y="224" font-size="20" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Keep the return flight.</text><circle cx="65" cy="280" r="7" fill="#f4f3ef" stroke="#242522"/><text x="90" y="275" font-size="16" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">TOOL</text><text x="90" y="302" font-size="20" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">update_reservation_flights</text><circle cx="65" cy="393" r="7" fill="#ec5b28" stroke="#242522"/><text x="90" y="388" font-size="16" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">OBSERVATION</text><text x="90" y="415" font-size="20" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">saved: True</text><circle cx="65" cy="487" r="7" fill="#f4f3ef" stroke="#242522"/><text x="90" y="482" font-size="16" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">CHECK</text><text x="90" y="509" font-size="20" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Is RETURN still in flights?</text><path d="M585,177L585,521" fill="none" stroke="#b6b7af" stroke-width="1.5"/><text x="625" y="204" font-size="20" font-weight="600" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">arguments.flights</text><text x="625" y="238" font-size="20" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">[NONSTOP, RETURN]</text><path d="M988,219V238H876" fill="none" stroke="#b6b7af" stroke-width="1.5"/><circle cx="876" cy="238" r="3" fill="#242522" stroke="none"/><circle cx="988" cy="207" r="13" fill="#242522" stroke="none"/><text x="988" y="214" font-size="19" font-weight="600" fill="#f4f3ef" font-family="IBM Plex Sans" text-anchor="middle">1</text><text x="1010" y="214" font-size="19" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Write payload</text><path d="M635,291H835L845,301V365L835,375H635L625,365V301Z" fill="#f4f3ef" stroke="#ec5b28" stroke-width="2"/><path d="M787,299L787,367" fill="none" stroke="#b6b7af" stroke-width="1.5" stroke-dasharray="3 4"/><text x="642" y="322" font-size="22" font-weight="600" fill="#ec5b28" font-family="IBM Plex Sans" text-anchor="start">NONSTOP</text><text x="642" y="352" font-size="16" font-weight="400" fill="#60625d" font-family="IBM Plex Mono" text-anchor="start">2024-05-20</text><path d="M800,310L800,355" fill="none" stroke="#242522" stroke-width="2"/><path d="M803,310L803,355" fill="none" stroke="#242522" stroke-width="1"/><path d="M806,310L806,355" fill="none" stroke="#242522" stroke-width="1"/><path d="M809,310L809,355" fill="none" stroke="#242522" stroke-width="2"/><path d="M812,310L812,355" fill="none" stroke="#242522" stroke-width="1"/><path d="M815,310L815,355" fill="none" stroke="#242522" stroke-width="1"/><path d="M818,310L818,355" fill="none" stroke="#242522" stroke-width="2"/><path d="M821,310L821,355" fill="none" stroke="#242522" stroke-width="1"/><path d="M824,310L824,355" fill="none" stroke="#242522" stroke-width="1"/><path d="M879,291H1079L1089,301V365L1079,375H879L869,365V301Z" fill="#f4f3ef" stroke="#242522" stroke-width="2"/><path d="M1031,299L1031,367" fill="none" stroke="#b6b7af" stroke-width="1.5" stroke-dasharray="3 4"/><text x="886" y="322" font-size="22" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">RETURN</text><text x="886" y="352" font-size="16" font-weight="400" fill="#60625d" font-family="IBM Plex Mono" text-anchor="start">2024-05-20</text><path d="M1044,310L1044,355" fill="none" stroke="#242522" stroke-width="2"/><path d="M1047,310L1047,355" fill="none" stroke="#242522" stroke-width="1"/><path d="M1050,310L1050,355" fill="none" stroke="#242522" stroke-width="1"/><path d="M1053,310L1053,355" fill="none" stroke="#242522" stroke-width="2"/><path d="M1056,310L1056,355" fill="none" stroke="#242522" stroke-width="1"/><path d="M1059,310L1059,355" fill="none" stroke="#242522" stroke-width="1"/><path d="M1062,310L1062,355" fill="none" stroke="#242522" stroke-width="2"/><path d="M1065,310L1065,355" fill="none" stroke="#242522" stroke-width="1"/><path d="M1068,310L1068,355" fill="none" stroke="#242522" stroke-width="1"/><text x="625" y="411" font-size="19" font-weight="600" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">result.reservation.flights</text><text x="625" y="449" font-size="20" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">[NONSTOP, RETURN]</text><path d="M625,470V486H1089V470" fill="none" stroke="#242522" stroke-width="2"/><text x="625" y="518" font-size="21" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Check RETURN against the original booking.</text><path d="M40,548L1160,548" fill="none" stroke="#b6b7af" stroke-width="1.5"/><text x="40" y="574" font-size="16" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">CODE</text><text x="130" y="574" font-size="17" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">Tool(arguments=args, result=result,</text><text x="130" y="597" font-size="17" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">     started_at=start, ended_at=end)</text><text x="750" y="574" font-size="16" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">OBSERVE</text><text x="750" y="599" font-size="19" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Find the payload and returned flights.</text><text x="750" y="622" font-size="19" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">A saved write is not a correctness check.</text></svg>