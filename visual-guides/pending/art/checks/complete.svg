<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Four checks answer different questions"><style>text{font-family:"IBM Plex Sans";fill:#242522}.mono{font-family:"IBM Plex Mono"}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#242522" stroke-width="1.3"/></marker></defs><rect width="1200" height="675" fill="#f4f3ef"/><text x="38" y="29" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">PENDING / CHECKS</text><text x="1162" y="29" font-size="16" font-weight="400" text-anchor="end" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">05 / 05</text><text x="38" y="67" font-size="30" font-weight="600" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">Four checks answer different questions</text><line x1="38" y1="84" x2="1162" y2="84" stroke="#b6b7af" stroke-width="1.5"/><path d="M355 185 H825 L845 205 V423 H355 Z" fill="#ffffff" stroke="#242522" stroke-width="1.5"/><path d="M825 185 V205 H845" fill="none" stroke="#b6b7af" stroke-width="1.8"/><text x="371" y="215" font-size="19" font-weight="600" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">Account acme / invoice inv-1</text><line x1="355" y1="229" x2="845" y2="229" stroke="#b6b7af" stroke-width="1.5"/><text x="373" y="263" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#60625d">payment     charged    disposition</text><line x1="367" y1="276" x2="833" y2="276" stroke="#b6b7af" stroke-width="1.5"/><text x="373" y="307" font-size="18" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">pay-1       $49.00     retained</text><text x="373" y="347" font-size="18" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">pay-2       $49.00     refunded</text><line x1="367" y1="365" x2="833" y2="365" stroke="#b6b7af" stroke-width="1.5"/><text x="373" y="400" font-size="18" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#ec5b28">refunds: [pay-2, 4900 cents]</text><text x="380" y="143" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">ONE DELIVERED ACCOUNT</text><text x="45" y="165" font-size="22" font-weight="600" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">1  Agent tool</text><text x="45" y="198" font-size="18" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">check_work</text><path d="M355 264 H255 V211" fill="none" stroke="#242522" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="45" y="238" font-size="18" font-weight="400" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">Did the employee use it?</text><g opacity="1"><text x="45" y="368" font-size="22" font-weight="600" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">2  Your scorer</text><text x="45" y="402" font-size="18" font-weight="400" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">Inspect refund count,</text><text x="45" y="427" font-size="18" font-weight="400" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">payment and amount.</text><path d="M355 386 H279" fill="none" stroke="#242522" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 5"/></g><g opacity="1"><text x="884" y="165" font-size="22" font-weight="600" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">3  Final grader</text><text x="884" y="199" font-size="18" font-weight="400" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">Fresh tickets;</text><text x="884" y="224" font-size="18" font-weight="400" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">outside harness files.</text><path d="M845 264 H1013 V245" fill="none" stroke="#242522" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 5"/></g><g opacity="1"><text x="884" y="369" font-size="22" font-weight="600" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">4  Explanation judge</text><text x="884" y="404" font-size="18" font-weight="400" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">Compare the message</text><text x="884" y="429" font-size="18" font-weight="400" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">with recorded work.</text><path d="M845 386 H875" fill="none" stroke="#242522" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 5"/><path d="M382 478 H797 V544 H382 Z M405 544 L392 557 L430 544" fill="#fff" stroke="#242522" stroke-width="1.8"/><text x="402" y="519" font-size="18" font-weight="400" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">“The duplicate payment was refunded.”</text><path d="M797 511 H1027 V445" fill="none" stroke="#242522" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 5"/></g><line x1="38" y1="574" x2="1162" y2="574" stroke="#b6b7af" stroke-width="1.5"/><text x="38" y="602" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">len(refunds) == 1 and refunds[0][&quot;amount_cents&quot;] == 4900</text><text x="38" y="636" font-size="17" font-weight="600" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">Illustrative</text><text x="216" y="632" font-size="18" font-weight="600" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">The state checks inspect the account; the judge evaluates the message about the work.</text></svg>