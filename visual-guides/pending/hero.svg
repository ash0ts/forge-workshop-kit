<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">An operations agent connected to a ticket and account</title><desc id="desc">An invoice ticket enters a terminal labeled instructions, tools, skills, and message history. The result is independently checked against payments, refunds, and memberships.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ef5b24"/></marker></defs><rect width="900" height="420" fill="#f1f2ed"/><circle cx="45" cy="40" r="14" fill="#222321" stroke="#222321" stroke-width="2"/><text x="45" y="45" font-size="15" fill="#fff" text-anchor="middle" font-family="IBM Plex Mono,sans-serif">1</text><text x="68" y="47" font-size="21" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Customer ticket</text><circle cx="350" cy="40" r="14" fill="#222321" stroke="#222321" stroke-width="2"/><text x="350" y="45" font-size="15" fill="#fff" text-anchor="middle" font-family="IBM Plex Mono,sans-serif">2</text><text x="373" y="47" font-size="21" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Employee’s harness</text><circle cx="660" cy="40" r="14" fill="#222321" stroke="#222321" stroke-width="2"/><text x="660" y="45" font-size="15" fill="#fff" text-anchor="middle" font-family="IBM Plex Mono,sans-serif">3</text><text x="683" y="47" font-size="21" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Checked account</text><path d="M48 100H208L232 124V264H48Z" fill="#fff" stroke="#222321" stroke-width="2"/><path d="M208 100V124H232" fill="none" stroke="#222321" stroke-width="2"/><text x="64" y="139" font-size="19" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Duplicate charge</text><path d="M65 155L210 155" fill="none" stroke="#222321" stroke-width="2"/><text x="64" y="181" font-size="16" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Invoice inv-1</text><text x="64" y="213" font-size="18" fill="#ef5b24" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Refund once.</text><text x="64" y="242" font-size="18" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Keep access.</text><path d="M245 180H305" fill="none" stroke="#ef5b24" stroke-width="3" marker-end="url(#arrow)"/><rect x="322" y="122" width="252" height="148" rx="0" fill="#fff" stroke="#222321" stroke-width="2"/><rect x="335" y="135" width="226" height="104" rx="0" fill="#f1f2ed" stroke="#222321" stroke-width="2"/><text x="350" y="164" font-size="18" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Instructions</text><text x="350" y="190" font-size="18" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Tools / skills</text><text x="350" y="216" font-size="18" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Message history</text><path d="M448 270L448 300" fill="none" stroke="#222321" stroke-width="2"/><path d="M400 300L496 300" fill="none" stroke="#222321" stroke-width="2"/><path d="M295 320L597 320" fill="none" stroke="#222321" stroke-width="2"/><path d="M313 320L313 367" fill="none" stroke="#222321" stroke-width="2"/><path d="M580 320L580 367" fill="none" stroke="#222321" stroke-width="2"/><circle cx="624" cy="229" r="19" fill="none" stroke="#222321" stroke-width="2"/><path d="M604 284V263Q624 242 644 263V303H673" fill="none" stroke="#222321" stroke-width="2"/><path d="M604 284H583V318" fill="none" stroke="#222321" stroke-width="2"/><path d="M585 180H655" fill="none" stroke="#ef5b24" stroke-width="3" marker-end="url(#arrow)"/><path d="M675 100H831L855 124V264H675Z" fill="#fff" stroke="#222321" stroke-width="2"/><path d="M831 100V124H855" fill="none" stroke="#222321" stroke-width="2"/><text x="693" y="140" font-size="17" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Payments</text><text x="693" y="170" font-size="17" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Refunds</text><text x="693" y="200" font-size="17" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Memberships</text><path d="M697 225l8 8 18-22" fill="none" stroke="#ef5b24" stroke-width="3"/><text x="738" y="233" font-size="17" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Verify</text><text x="47" y="391" font-size="21" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Trace the action. Read the returned state. Test the next procedure.</text></svg>
