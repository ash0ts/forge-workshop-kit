<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="455" viewBox="0 0 1200 455" role="img" aria-label="A customer ticket, agent tools, and the resulting account"><title>A customer ticket, agent tools, and the resulting account</title><desc>Illustrative acme invoice inv-1. The ticket asks to keep pay-1 and refund duplicate pay-2. The agent calls lookup_invoice and refund_payment, then reads the actual account. The ledger retains pay-1 and records the 4900-cent refund for pay-2.</desc><style>text{font-family:"IBM Plex Sans";fill:#242522}.mono{font-family:"IBM Plex Mono"}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#242522" stroke-width="1.3"/></marker></defs><rect width="1200" height="455" fill="#f4f3ef"/><path d="M28 63H294V357L280 367L266 357L252 367L238 357L224 367L210 357L196 367L182 357L168 367L154 357L140 367L126 357L112 367L98 357L84 367L70 357L56 367L42 357L28 367Z" fill="#fff" stroke="#242522" stroke-width="2"/><text x="48" y="103" font-size="28" font-weight="600" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">Customer ticket</text><line x1="28" y1="124" x2="294" y2="124" stroke="#b6b7af" stroke-width="1.5"/><text x="48" y="163" font-size="24" font-weight="400" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">acme / inv-1</text><text x="48" y="205" font-size="24" font-weight="400" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">Charged twice.</text><text x="48" y="259" font-size="26" font-weight="600" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">Keep pay-1.</text><text x="48" y="302" font-size="26" font-weight="600" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">Refund pay-2.</text><line x1="43" y1="330" x2="278" y2="330" stroke="#b6b7af" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="376" y="70" width="279" height="264" fill="#f4f3ef" stroke="#b6b7af" stroke-width="1.5"/><rect x="370" y="76" width="279" height="264" fill="#f4f3ef" stroke="#b6b7af" stroke-width="1.5"/><rect x="364" y="82" width="279" height="264" fill="#fff" stroke="#242522" stroke-width="2"/><text x="383" y="118" font-size="28" font-weight="600" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">Agent loop</text><line x1="364" y1="137" x2="643" y2="137" stroke="#b6b7af" stroke-width="1.5"/><text x="383" y="177" font-size="24" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">lookup_invoice</text><line x1="380" y1="199" x2="628" y2="199" stroke="#b6b7af" stroke-width="1.5"/><text x="383" y="238" font-size="24" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">refund_payment</text><line x1="380" y1="260" x2="628" y2="260" stroke="#b6b7af" stroke-width="1.5"/><text x="383" y="302" font-size="26" font-weight="600" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">read account</text><path d="M294 219H328V176H362" fill="none" stroke="#242522" stroke-width="2" marker-end="url(#arrow)"/><path d="M643 238H666V188H689" fill="none" stroke="#242522" stroke-width="2" marker-end="url(#arrow)"/><rect x="691" y="63" width="480" height="284" fill="#fff" stroke="#242522" stroke-width="2"/><rect x="691" y="63" width="480" height="64" fill="#e8e9e3" stroke="#242522" stroke-width="1.5"/><text x="713" y="106" font-size="28" font-weight="600" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">Account acme / inv-1</text><text x="713" y="164" font-size="24" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#60625d">payment   cents   state</text><line x1="704" y1="182" x2="1157" y2="182" stroke="#b6b7af" stroke-width="1.5"/><text x="713" y="221" font-size="24" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">pay-1     4900    kept</text><rect x="704" y="240" width="453" height="53" fill="#f4f3ef" stroke="#ec5b28" stroke-width="2"/><text x="713" y="276" font-size="24" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">pay-2     4900    refunded</text><text x="713" y="329" font-size="26" font-weight="600" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">refunds: [pay-2]</text><path d="M1100 347V407H502V346" fill="none" stroke="#242522" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="700" y="440" font-size="26" font-weight="600" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">Read back the changed record</text></svg>