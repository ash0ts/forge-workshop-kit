<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="455" viewBox="0 0 1200 455" role="img" aria-label="A GTFS departure crosses two owned files into one board"><title>A GTFS departure crosses two owned files into one board</title><desc>Frozen historical MBTA record: trip 63926435 at stop 70076 departs at GTFS time 24:08:00. The query worker resolves the service day, and the presentation worker renders the shared departure record. Park Street shows 00:08 on November 29, 2024 while service_date remains November 28, 2024 in America/New_York.</desc><style>text{font-family:"IBM Plex Sans";fill:#242522}.mono{font-family:"IBM Plex Mono"}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#242522" stroke-width="1.3"/></marker></defs><rect width="1200" height="455" fill="#f4f3ef"/><path d="M22 58H306L330 82V367H22Z" fill="#fff" stroke="#242522" stroke-width="2"/><path d="M306 58V82H330" fill="none" stroke="#b6b7af" stroke-width="1.8"/><text x="42" y="103" font-size="27" font-weight="600" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">stop_times.txt</text><line x1="22" y1="123" x2="330" y2="123" stroke="#b6b7af" stroke-width="1.5"/><text x="42" y="162" font-size="26" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">trip 63926435</text><text x="42" y="207" font-size="26" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">stop 70076</text><text x="42" y="261" font-size="24" font-weight="400" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#60625d">departure</text><text x="42" y="308" font-size="38" font-weight="600" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">24:08:00</text><text x="42" y="348" font-size="24" font-weight="400" text-anchor="sta