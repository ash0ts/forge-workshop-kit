<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">A historical departure schedule built by two workers into one app</title><desc id="desc">A Park Street historical service-time record feeds separate query and view workers. Their patches join before a departure-board application is checked. The displayed 24:08 service time corresponds to the public exercise.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ef5b24"/></marker></defs><rect width="900" height="420" fill="#f1f2ed"/><circle cx="45" cy="40" r="14" fill="#222321" stroke="#222321" stroke-width="2"/><text x="45" y="45" font-size="15" fill="#fff" text-anchor="middle" font-family="IBM Plex Mono,sans-serif">1</text><text x="68" y="47" font-size="21" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Read service time</text><circle cx="330" cy="40" r="14" fill="#222321" stroke="#222321" stroke-width="2"/><text x="330" y="45" font-size="15" fill="#fff" text-anchor="middle" font-family="IBM Plex Mono,sans-serif">2</text><text x="353" y="47" font-size="21" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Assign owned work</text><circle cx="650" cy="40" r="14" fill="#222321" stroke="#222321" stroke-width="2"/><text x="650" y="45" font-size="15" fill="#fff" text-anchor="middle" font-family="IBM Plex Mono,sans-serif">3</text><text x="673" y="47" font-size="21" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Test the app</text><rect x="45" y="111" width="204" height="164" rx="0" fill="#222321" stroke="#222321" stroke-width="2"/><text x="63" y="147" font-size="17" fill="#fff" text-anchor="start" font-family="IBM Plex Sans,sans-serif">PARK STREET</text><text x="63" y="190" font-size="26" fill="#fff" text-anchor="start" font-family="IBM Plex Mono,sans-serif">24:08:00</text><text x="63" y="221" font-size="14" fill="#fff" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Service day: Nov 28</text><text x="47" y="300" font-size="18" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Civil date: Nov 29</text><text x="47" y="328" font-size="18" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">00:08 · historical</text><path d="M262 195H304" fill="none" stroke="#ef5b24" stroke-width="3" marker-end="url(#arrow)"/><path d="M311 195V130H351M311 195V263H351" fill="none" stroke="#222321" stroke-width="2"/><rect x="353" y="105" width="183" height="73" rx="0" fill="#fff" stroke="#4178b9" stroke-width="2"/><text x="369" y="134" font-size="18" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Query worker</text><text x="369" y="159" font-size="14" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">read → edit → test</text><path d="M536 141H590V200" fill="none" stroke="#4178b9" stroke-width="2"/><rect x="353" y="239" width="183" height="73" rx="0" fill="#fff" stroke="#ef5b24" stroke-width="2"/><text x="369" y="268" font-size="18" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">View worker</text><text x="369" y="293" font-size="14" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">read → edit → test</text><path d="M536 275H590V200" fill="none" stroke="#ef5b24" stroke-width="2"/><circle cx="590" cy="200" r="10" fill="#fff" stroke="#222321" stroke-width="2"/><path d="M605 200H645" fill="none" stroke="#ef5b24" stroke-width="3" marker-end="url(#arrow)"/><rect x="661" y="108" width="191" height="177" rx="0" fill="#fff" stroke="#222321" stroke-width="2"/><text x="677" y="142" font-size="18" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">DEPARTURES</text><path d="M674 153L838 153" fill="none" stroke="#222321" stroke-width="2"/><text x="677" y="184" font-size="22" fill="#222321" text-anchor="start" font-family="IBM Plex Mono,sans-serif">00:08</text><text x="677" y="218" font-size="17" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Next service</text><path d="M680 247l8 8 17-22" fill="none" stroke="#ef5b24" stroke-width="3"/><text x="715" y="253" font-size="17" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Checked</text><text x="47" y="391" font-size="21" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Both workers can finish before the integrated application works.</text></svg>
