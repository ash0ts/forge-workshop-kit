<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Claim each task once"><style>text{font-family:"IBM Plex Sans";fill:#242522}.mono{font-family:"IBM Plex Mono"}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#242522" stroke-width="1.3"/></marker></defs><rect width="1200" height="675" fill="#f4f3ef"/><text x="38" y="29" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">TRANSIT / CLAIMS</text><text x="1162" y="29" font-size="16" font-weight="400" text-anchor="end" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">02 / 04</text><text x="38" y="67" font-size="30" font-weight="600" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">Claim each task once</text><line x1="38" y1="84" x2="1162" y2="84" stroke="#b6b7af" stroke-width="1.5"/><text x="47" y="121" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">CONTROLLED CLAIM DRILL</text><text x="130" y="163" font-size="22" font-weight="600" text-anchor="middle" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">Worker 1</text><line x1="130" y1="181" x2="130" y2="433" stroke="#b6b7af" stroke-width="2"/><text x="600" y="163" font-size="22" font-weight="600" text-anchor="middle" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">Task board</text><line x1="600" y1="181" x2="600" y2="433" stroke="#b6b7af" stroke-width="2"/><text x="1070" y="163" font-size="22" font-weight="600" text-anchor="middle" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">Worker 2</text><line x1="1070" y1="181" x2="1070" y2="433" stroke="#b6b7af" stroke-width="2"/><path d="M130 217 H584" fill="none" stroke="#242522" stroke-width="1.8" marker-end="url(#arrow)"/><text x="230" y="204" font-size="18" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">read: owner=None</text><path d="M1070 247 H616" fill="none" stroke="#242522" stroke-width="1.8" marker-end="url(#arrow)"/><text x="740" y="234" font-size="18" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">read: owner=None</text><text x="452" y="283" font-size="18" font-weight="400" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">Both reads can see an unclaimed task.</text><g opacity="1"><rect x="565" y="304" width="70" height="100" fill="#e8e9e3" stroke="#ec5b28" stroke-width="2"/><path d="M130 325 H565" fill="none" stroke="#242522" stroke-width="1.8" marker-end="url(#arrow)"/><text x="207" y="315" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">claim(query, worker-1)</text><path d="M1070 383 H635" fill="none" stroke="#242522" stroke-width="1.8" marker-end="url(#arrow)"/><text x="747" y="372" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">claim(query, worker-2)</text><text x="157" y="369" font-size="19" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">owner = worker-1</text><text x="760" y="423" font-size="18" font-weight="400" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">cannot acquire same claim</text><text x="484" y="454" font-size="18" font-weight="600" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">atomic ownership update</text></g><g opacity="0.25"><text x="47" y="508" font-size="20" font-weight="600" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">Dependencies</text><text x="241" y="508" font-size="18" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#60625d">submitted</text><path d="M367 502 H480" fill="none" stroke="#242522" stroke-width="1.8" stroke-dasharray="5 5"/><line x1="442" y1="489" x2="442" y2="515" stroke="#ec5b28" stroke-width="4"/><text x="498" y="508" font-size="18" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">integrated</text><path d="M636 502 H768" fill="none" stroke="#242522" stroke-width="1.8" marker-end="url(#arrow)"/><text x="787" y="508" font-size="18" font-weight="400" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">dependent task becomes ready</text></g><line x1="38" y1="574" x2="1162" y2="574" stroke="#b6b7af" stroke-width="1.5"/><text x="38" y="602" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">return board.claim(task_id, worker_id)</text><text x="38" y="636" font-size="17" font-weight="600" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">Controlled drill</text><text x="216" y="632" font-size="18" font-weight="600" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">Read-then-write can race. Claim atomically; unblock dependencies only after integration.</text></svg>