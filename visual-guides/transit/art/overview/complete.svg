<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Build a departure board with two coding agents"><style>text{font-family:"IBM Plex Sans";fill:#242522}.mono{font-family:"IBM Plex Mono"}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#242522" stroke-width="1.3"/></marker></defs><rect width="1200" height="675" fill="#f4f3ef"/><text x="38" y="29" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">TRANSIT / OVERVIEW</text><text x="1162" y="29" font-size="16" font-weight="400" text-anchor="end" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">05 / 05</text><text x="38" y="67" font-size="30" font-weight="600" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">Build a departure board with two coding agents</text><line x1="38" y1="84" x2="1162" y2="84" stroke="#b6b7af" stroke-width="1.5"/><text x="45" y="124" font-size="18" font-weight="600" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">MBTA GTFS / frozen source</text><path d="M45 148 H300 V182 H45 Z" fill="#fff" stroke="#242522" stroke-width="1.8"/><text x="58" y="172" font-size="17" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">stop_times</text><path d="M45 194 H300 V228 H45 Z" fill="#fff" stroke="#242522" stroke-width="1.8"/><text x="58" y="218" font-size="17" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">trips</text><path d="M45 240 H300 V274 H45 Z" fill="#fff" stroke="#242522" stroke-width="1.8"/><text x="58" y="264" font-size="17" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">calendar + exceptions</text><path d="M170 274 V314 H343" fill="none" stroke="#242522" stroke-width="1.8" marker-end="url(#arrow)"/><g opacity="1"><text x="45" y="363" font-size="20" font-weight="600" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">Two owned source files</text><rect x="45" y="389" width="262" height="56" fill="#fff" stroke="#246cac" stroke-width="2"/><text x="61" y="413" font-size="20" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">query.py</text><line x1="62" y1="431" x2="112" y2="431" stroke="#246cac" stroke-width="1.5"/><line x1="137" y1="431" x2="187" y2="431" stroke="#246cac" stroke-width="1.5"/><line x1="212" y1="431" x2="262" y2="431" stroke="#246cac" stroke-width="1.5"/><rect x="45" y="472" width="262" height="56" fill="#fff" stroke="#ec5b28" stroke-width="2"/><text x="61" y="496" font-size="20" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">presentation.py</text><line x1="62" y1="514" x2="112" y2="514" stroke="#ec5b28" stroke-width="1.5"/><line x1="137" y1="514" x2="187" y2="514" stroke="#ec5b28" stroke-width="1.5"/><line x1="212" y1="514" x2="262" y2="514" stroke="#ec5b28" stroke-width="1.5"/><path d="M307 418 H348 V317 H396" fill="none" stroke="#242522" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M307 500 H368 V336 H396" fill="none" stroke="#242522" stroke-width="1.8" marker-end="url(#arrow)"/><text x="316" y="293" font-size="18" font-weight="400" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">join</text></g><g opacity="1"><rect x="396" y="150" width="752" height="235" fill="#fff" stroke="#242522" stroke-width="2"/><rect x="396" y="150" width="752" height="51" fill="#242522" stroke="#242522" stroke-width="1.5"/><text x="414" y="184" font-size="21" font-weight="600" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#f4f3ef">PARK STREET / historical schedule</text><text x="414" y="240" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#60625d">trip         departure          service day</text><line x1="410" y1="255" x2="1134" y2="255" stroke="#b6b7af" stroke-width="1.5"/><text x="414" y="292" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">63926435     00:08 Nov 29        Nov 28</text><line x1="410" y1="311" x2="1134" y2="311" stroke="#b6b7af" stroke-width="1.5"/><text x="414" y="346" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">GTFS 24:08:00  /  America/New_York</text><text x="414" y="370" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#60625d">Frozen 2024 feed; not live arrivals</text><path d="M1080 433 L1080 290" fill="none" stroke="#242522" stroke-width="1"/><circle cx="1080" cy="290" r="3" fill="#242522"/><circle cx="1080" cy="433" r="13" fill="#f4f3ef" stroke="#242522" stroke-width="1.5"/><text x="1080" y="439" font-size="17" font-weight="600" text-anchor="middle" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">1</text><text x="712" y="432" font-size="18" font-weight="400" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">After midnight, the civil date changes.</text><text x="712" y="461" font-size="18" font-weight="400" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">The GTFS service date stays November 28.</text></g><g opacity="1"><path d="M560 385 V507 H812" fill="none" stroke="#242522" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="416" y="532" font-size="18" font-weight="400" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">Save the checked lesson</text><path d="M812 483 H1148 V546 H812 Z" fill="#e8e9e3" stroke="#242522" stroke-width="1.8"/><text x="830" y="510" font-size="18" font-weight="400" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">Next build: with / without memory</text><text x="830" y="536" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">same task + allowance</text></g><line x1="38" y1="574" x2="1162" y2="574" stroke="#b6b7af" stroke-width="1.5"/><text x="38" y="602" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve" class="mono" style="white-space:pre;fill:#242522">query.departures(stop_id, at) → presentation.render_board(departures)</text><text x="38" y="636" font-size="17" font-weight="600" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">Illustrative</text><text x="216" y="632" font-size="18" font-weight="600" text-anchor="start" xml:space="preserve" class="sans" style="white-space:pre;fill:#242522">Coordinate ownership, test the assembled board, then measure whether a checked lesson helps.</text></svg>