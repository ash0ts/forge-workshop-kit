<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">A request becomes scores, then a support route</title><desc id="desc">An illustrative replacement-card message is transformed into probability columns. A destination is chosen, with human review as a separate policy. Bar heights are schematic, not recorded probabilities.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ef5b24"/></marker></defs><rect width="900" height="420" fill="#f1f2ed"/><circle cx="45" cy="40" r="14" fill="#222321" stroke="#222321" stroke-width="2"/><text x="45" y="45" font-size="15" fill="#fff" text-anchor="middle" font-family="IBM Plex Mono,sans-serif">1</text><text x="68" y="47" font-size="21" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Read the request</text><circle cx="345" cy="40" r="14" fill="#222321" stroke="#222321" stroke-width="2"/><text x="345" y="45" font-size="15" fill="#fff" text-anchor="middle" font-family="IBM Plex Mono,sans-serif">2</text><text x="368" y="47" font-size="21" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Score intents</text><circle cx="640" cy="40" r="14" fill="#222321" stroke="#222321" stroke-width="2"/><text x="640" y="45" font-size="15" fill="#fff" text-anchor="middle" font-family="IBM Plex Mono,sans-serif">3</text><text x="663" y="47" font-size="21" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Route or review</text><path d="M46 115H275V235H112L84 263V235H46Z" fill="#fff" stroke="#222321" stroke-width="2"/><text x="66" y="153" font-size="21" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Where is my</text><text x="66" y="184" font-size="21" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">replacement</text><text x="66" y="215" font-size="21" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">card?</text><text x="48" y="310" font-size="16" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Illustrative request</text><path d="M285 174H343" fill="none" stroke="#ef5b24" stroke-width="3" marker-end="url(#arrow)"/><path d="M367 267L561 267" fill="none" stroke="#222321" stroke-width="2"/><rect x="379" y="162" width="25" height="105" rx="0" fill="#ef5b24" stroke="#222321" stroke-width="2"/><rect x="424" y="215" width="25" height="52" rx="0" fill="#d8d9d4" stroke="#222321" stroke-width="2"/><rect x="469" y="193" width="25" height="74" rx="0" fill="#d8d9d4" stroke="#222321" stroke-width="2"/><rect x="514" y="235" width="25" height="32" rx="0" fill="#d8d9d4" stroke="#222321" stroke-width="2"/><text x="375" y="296" font-size="18" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Intent columns</text><text x="375" y="323" font-size="18" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Keep their order.</text><path d="M564 174H614" fill="none" stroke="#ef5b24" stroke-width="3" marker-end="url(#arrow)"/><path d="M637 141H844V113H752L740 99H637Z" fill="#fff" stroke="#222321" stroke-width="2"/><text x="657" y="128" font-size="18" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Delivery</text><path d="M637 221H844V193H752L740 179H637Z" fill="#fff" stroke="#222321" stroke-width="2"/><text x="657" y="208" font-size="18" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Card issues</text><path d="M637 301H844V273H752L740 259H637Z" fill="#fff" stroke="#222321" stroke-width="2"/><text x="657" y="288" font-size="18" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Human review</text><path d="M618 174V120H636" fill="none" stroke="#ef5b24" stroke-width="3" marker-end="url(#arrow)"/><path d="M618 174V280H636" fill="none" stroke="#222321" stroke-width="2"/><text x="47" y="391" font-size="21" fill="#222321" text-anchor="start" font-family="IBM Plex Sans,sans-serif">Features choose an intent. A review policy decides when to defer.</text></svg>
