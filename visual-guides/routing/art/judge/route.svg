<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>Check the automated reviewer against people</title><desc>Illustrative teaching view • see linked source records</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#242522" stroke-width="1.4"/></marker></defs><rect x="0" y="0" width="1200" height="675" rx="0" fill="#f4f3ef" stroke="none" stroke-width="1.5"/><text x="40" y="28" font-size="16" font-weight="400" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">03 / Customer request routing</text><text x="40" y="66" font-size="30" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Check the automated reviewer against people</text><text x="1160" y="28" font-size="16" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="end">01/04</text><path d="M40,82L1160,82" fill="none" stroke="#b6b7af" stroke-width="1.5"/><text x="40" y="650" font-size="17" font-weight="400" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">Illustrative teaching view • see linked source records</text><path d="M40,107H1150V180H80L60,199V180H40Z" fill="#f4f3ef" stroke="#242522" stroke-width="2"/><text x="60" y="134" font-size="16" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">RECORDED REQUEST</text><text x="60" y="166" font-size="25" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">“Can I activate a card in the app?”</text><text x="40" y="236" font-size="18" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">ROUTER</text><text x="40" y="271" font-size="25" font-weight="600" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">activate_my_card</text><text x="40" y="314" font-size="18" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">DATASET REFERENCE</text><text x="40" y="349" font-size="25" font-weight="600" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">card_linking</text><path d="M572,213L572,365" fill="none" stroke="#b6b7af" stroke-width="1.5"/><text x="640" y="236" font-size="18" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">AUTOMATED REVIEWER</text><text x="640" y="278" font-size="20" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Inspect the request before the judgment.</text><path d="M40,380L1150,380" fill="none" stroke="#b6b7af" stroke-width="1.5"/><text x="40" y="413" font-size="22" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Human review question</text><text x="40" y="448" font-size="20" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Does “activate … in the app” mean activation or linking? The wording is ambiguous.</text><path d="M40,548L1160,548" fill="none" stroke="#b6b7af" stroke-width="1.5"/><text x="40" y="574" font-size="16" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">CODE</text><text x="130" y="574" font-size="17" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">type(value[&quot;failed&quot;]) is bool</text><text x="130" y="597" font-size="17" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">bool(value[&quot;reason&quot;].strip())</text><text x="750" y="574" font-size="16" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">OBSERVE</text><text x="750" y="599" font-size="19" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Reference disagreement calls for review.</text><text x="750" y="622" font-size="19" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">It is not proof the judge is wrong.</text></svg>