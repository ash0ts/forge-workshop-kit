<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>Calculate F1 for each intent before averaging</title><desc>Illustrative teaching view • see linked source records</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#242522" stroke-width="1.4"/></marker></defs><rect x="0" y="0" width="1200" height="675" rx="0" fill="#f4f3ef" stroke="none" stroke-width="1.5"/><text x="40" y="28" font-size="16" font-weight="400" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">03 / Customer request routing</text><text x="40" y="66" font-size="30" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Calculate F1 for each intent before averaging</text><text x="1160" y="28" font-size="16" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="end">02/04</text><path d="M40,82L1160,82" fill="none" stroke="#b6b7af" stroke-width="1.5"/><text x="40" y="650" font-size="17" font-weight="400" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">Illustrative teaching view • see linked source records</text><text x="40" y="116" font-size="23" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Illustrative counts for one intent: card_arrival</text><text x="550" y="152" font-size="18" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">PREDICTED</text><text x="515" y="187" font-size="19" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">card_arrival</text><text x="790" y="187" font-size="19" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">another intent</text><text x="40" y="273" font-size="18" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">ACTUAL</text><text x="205" y="270" font-size="18" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">card_arrival</text><text x="205" y="406" font-size="18" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">another intent</text><rect x="450" y="208" width="265" height="122" rx="0" fill="#f4f3ef" stroke="#242522" stroke-width="1.5"/><circle cx="478" cy="244" r="9" fill="#242522" stroke="none"/><circle cx="522" cy="244" r="9" fill="#242522" stroke="none"/><circle cx="566" cy="244" r="9" fill="#242522" stroke="none"/><circle cx="610" cy="244" r="9" fill="#242522" stroke="none"/><circle cx="478" cy="280" r="9" fill="#242522" stroke="none"/><circle cx="522" cy="280" r="9" fill="#242522" stroke="none"/><circle cx="566" cy="280" r="9" fill="#242522" stroke="none"/><circle cx="610" cy="280" r="9" fill="#242522" stroke="none"/><text x="689" y="306" font-size="19" font-weight="600" fill="#242522" font-family="IBM Plex Mono" text-anchor="end">TP = 8</text><rect x="730" y="208" width="265" height="122" rx="0" fill="#f4f3ef" stroke="#242522" stroke-width="1.5"/><circle cx="758" cy="244" r="9" fill="#ec5b28" stroke="none"/><circle cx="802" cy="244" r="9" fill="#ec5b28" stroke="none"/><text x="969" y="306" font-size="19" font-weight="600" fill="#242522" font-family="IBM Plex Mono" text-anchor="end">FN = 2</text><rect x="450" y="344" width="265" height="122" rx="0" fill="#f4f3ef" stroke="#242522" stroke-width="1.5"/><circle cx="478" cy="380" r="9" fill="#ec5b28" stroke="none"/><circle cx="522" cy="380" r="9" fill="#ec5b28" stroke="none"/><text x="689" y="442" font-size="19" font-weight="600" fill="#242522" font-family="IBM Plex Mono" text-anchor="end">FP = 2</text><rect x="730" y="344" width="265" height="122" rx="0" fill="#e8e9e3" stroke="#242522" stroke-width="1.5"/><text x="754" y="386" font-size="20" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">True negatives</text><text x="754" y="420" font-size="19" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Not in this F1 fraction</text><text x="40" y="513" font-size="25" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">F1 = 2TP / (2TP + FP + FN) = 16 / 20 = 0.8</text><path d="M40,548L1160,548" fill="none" stroke="#b6b7af" stroke-width="1.5"/><text x="40" y="574" font-size="16" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">CODE</text><text x="130" y="574" font-size="17" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">f1_score(targets, predictions, labels=labels,</text><text x="130" y="597" font-size="17" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">         average=&quot;macro&quot;, zero_division=0)</text><text x="750" y="574" font-size="16" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">OBSERVE</text><text x="750" y="599" font-size="19" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Calculate F1 separately for each intent.</text><text x="750" y="622" font-size="19" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Then average all 77 scores equally.</text></svg>