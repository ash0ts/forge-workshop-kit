<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>Choose a route, then decide whether to review it</title><desc>Illustrative teaching view • see linked source records</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#242522" stroke-width="1.4"/></marker></defs><rect x="0" y="0" width="1200" height="675" rx="0" fill="#f4f3ef" stroke="none" stroke-width="1.5"/><text x="40" y="28" font-size="16" font-weight="400" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">03 / Customer request routing</text><text x="40" y="66" font-size="30" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Choose a route, then decide whether to review it</text><text x="1160" y="28" font-size="16" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="end">02/04</text><path d="M40,82L1160,82" fill="none" stroke="#b6b7af" stroke-width="1.5"/><text x="40" y="650" font-size="17" font-weight="400" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">Illustrative teaching view • see linked source records</text><text x="40" y="116" font-size="22" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Illustrative close-up: three of the model’s 77 intent columns</text><rect x="60" y="190" width="330" height="62" rx="0" fill="#ec5b28" stroke="#242522" stroke-width="1.5"/><text x="225.0" y="227" font-size="22" font-weight="600" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">0.72</text><text x="225.0" y="277" font-size="17" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">card_arrival</text><text x="225.0" y="179" font-size="16" font-weight="400" fill="#60625d" font-family="IBM Plex Mono" text-anchor="middle">[0]</text><rect x="390" y="190" width="330" height="62" rx="0" fill="#f4f3ef" stroke="#242522" stroke-width="1.5"/><text x="555.0" y="227" font-size="22" font-weight="600" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">0.18</text><text x="555.0" y="277" font-size="17" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">card_linking</text><text x="555.0" y="179" font-size="16" font-weight="400" fill="#60625d" font-family="IBM Plex Mono" text-anchor="middle">[1]</text><rect x="720" y="190" width="330" height="62" rx="0" fill="#f4f3ef" stroke="#242522" stroke-width="1.5"/><text x="885.0" y="227" font-size="22" font-weight="600" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">0.10</text><text x="885.0" y="277" font-size="17" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">activate_my_card</text><text x="885.0" y="179" font-size="16" font-weight="400" fill="#60625d" font-family="IBM Plex Mono" text-anchor="middle">[2]</text><text x="60" y="318" font-size="25" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Chosen route: card_arrival</text><path d="M60,373L1110,373" fill="none" stroke="#242522" stroke-width="2"/><path d="M60,367L60,379" fill="none" stroke="#242522" stroke-width="1.5"/><text x="60" y="409" font-size="18" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">0.0</text><path d="M585,367L585,379" fill="none" stroke="#242522" stroke-width="1.5"/><text x="585" y="409" font-size="18" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">0.5</text><path d="M1110,367L1110,379" fill="none" stroke="#242522" stroke-width="1.5"/><text x="1110" y="409" font-size="18" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">1.0</text><circle cx="249" cy="373" r="7" fill="#f4f3ef" stroke="#242522"/><text x="249" y="348" font-size="18" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="middle">runner-up 0.18</text><circle cx="816" cy="373" r="8" fill="#ec5b28" stroke="none"/><text x="816" y="348" font-size="18" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="middle">top 0.72</text><path d="M900,333L900,448" fill="none" stroke="#242522" stroke-width="1.5" stroke-dasharray="5 4"/><text x="900" y="481" font-size="18" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="middle">threshold 0.80</text><text x="60" y="443" font-size="22" font-weight="600" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">0.72 &lt; 0.80 → send to human review</text><path d="M40,548L1160,548" fill="none" stroke="#b6b7af" stroke-width="1.5"/><text x="40" y="574" font-size="16" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">CODE</text><text x="130" y="574" font-size="17" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">defer = confidence &lt; threshold</text><text x="130" y="597" font-size="17" font-weight="400" fill="#242522" font-family="IBM Plex Mono" text-anchor="start">margin = top_probability - runner_up</text><text x="750" y="574" font-size="16" font-weight="600" fill="#60625d" font-family="IBM Plex Sans" text-anchor="start">OBSERVE</text><text x="750" y="599" font-size="19" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Threshold controls routing coverage.</text><text x="750" y="622" font-size="19" font-weight="400" fill="#242522" font-family="IBM Plex Sans" text-anchor="start">Margin describes competing predictions.</text></svg>