[project]
name = "forge-workshop-kit"
version = "0.6.2"
description = "Copy a notebook, build an experiment, save the evidence in your own Forge project."
requires-python = ">=3.11,<3.14"
dependencies = [
  "marimo==0.25.2", "wandb==0.31.0", "weave==0.54.0",
  "coreweave==0.1.0b0", "wandb-workspaces==0.4.13", "httpx==0.28.1",
  "filelock>=3.16,<4",
]

[project.optional-dependencies]
pending = ["mcp>=1.20,<2"]
solar = [
  "numpy>=2,<3", "pandas>=2.2,<3", "matplotlib>=3.9,<4",
  "torch>=2.5,<3", "sunpy[map]>=7,<9",
]
routing = ["numpy>=2,<3", "scikit-learn>=1.6,<2", "pillow>=11,<13", "matplotlib>=3.9,<4"]
inspection = ["numpy>=2,<3", "scikit-learn>=1.6,<2", "pillow>=11,<13", "matplotlib>=3.9,<4", "torch>=2.5,<3"]
remote = ["cwsandbox[wandb]==1.19.6"]

[dependency-groups]
data-prep = ["sunpy[net,timeseries,map]>=7,<9", "numpy>=2,<3", "pandas>=2.2,<3", "transformers>=4.50,<5", "huggingface-hub>=0.30,<1"]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_workshop_kit"]

[tool.hatch.build.targets.sdist]
exclude = ["**/__marimo__/**"]
include = [
  "/src", "/scripts", "/notebooks", "/tests", "/examples", "/docs",
  "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock", "/data/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.workshop-build]
uv-version = "0.11.27"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
