="20" font-weight="600" fill="#242522" data-box="489 171 307 30.0">manifest.json</text><path d="M475 203L812 203" fill="none" stroke="#b6b7af" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="489" y="230" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#242522" data-box="489 214 309 24.0">version: &quot;v4&quot;</text><text x="489" y="259" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#242522" data-box="489 243 309 24.0">model:  92c7…ef10</text><text x="489" y="288" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#242522" data-box="489 272 309 24.0">labels: 41a8…97b2</text><text x="489" y="317" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#242522" data-box="489 301 309 24.0">source: 3fd0…184c</text><text x="489" y="346" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#242522" data-box="489 330 309 24.0">checks: &quot;passed&quot;</text><path d="M412 285L472 285" fill="none" stroke="#ec5b28" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M462.00 280.00L472.00 285.00L462.00 290.00" fill="none" stroke="#ec5b28" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="421" y="450" font-family="IBM Plex Sans" font-size="16" font-weight="400" fill="#242522" data-box="421 434 190 24.0">hash each file</text><rect x="910" y="177" width="238" height="91" rx="0" fill="#ffffff" stroke="#242522" stroke-width="1.6"/><text x="927" y="215" font-family="IBM Plex Sans" font-size="26" font-weight="600" fill="#242522" data-box="927 189 62 39.0">v3</text><text x="927" y="245" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#242522" data-box="927 229 210 24.0">b501…809a</text><circle cx="892" cy="221" r="9" fill="#f4f3ef" stroke="#242522" stroke-width="1.6"/><rect x="910" y="307" width="238" height="91" rx="0" fill="#ffffff" stroke="#242522" stroke-width="1.6"/><text x="927" y="345" font-family="I