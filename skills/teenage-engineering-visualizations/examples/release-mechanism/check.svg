e="17" font-weight="600" fill="#242522" data-box="813 466 20 25.5">2</text><text x="841" y="482" font-family="IBM Plex Sans" font-size="18" font-weight="600" fill="#242522" data-box="841 464 305 27.0">Only this pointer changes</text><path d="M36 548L1164 548" fill="none" stroke="#b6b7af" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="36" y="579" font-family="IBM Plex Mono" font-size="17" font-weight="400" fill="#242522" data-box="36 562 1125 25.5">assert actual_hashes == manifest[&quot;file_hashes&quot;]</text><text x="36" y="625" font-family="IBM Plex Sans" font-size="20" font-weight="600" fill="#242522" data-box="36 605 1125 30.0">A matching filename is insufficient. Verify the contents before loading.</text><text x="1080" y="31" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#242522" data-box="1080 16 90 22.5">02 / 04</text></svg>