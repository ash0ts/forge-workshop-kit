<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="IBM Plex Sans" fill="#242522"><title>An exact release, then a rollback</title><rect width="1200" height="675" fill="#f4f3ef"/><text x="36" y="29" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#242522" data-box="36 14 920 22.5">LOCAL RELEASE / ILLUSTRATIVE MECHANISM</text><text x="36" y="71" font-family="IBM Plex Sans" font-size="30" font-weight="600" fill="#242522" data-box="36 41 1100 45.0">The release pointer moves. The saved files do not.</text><path d="M36 90L1164 90" fill="none" stroke="#b6b7af" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="36" y="124" font-family="IBM Plex Sans" font-size="20" font-weight="600" fill="#242522" data-box="36 104 410 30.0">01  Inspect the saved package</text><text x="460" y="124" font-family="IBM Plex Sans" font-size="20" font-weight="600" fill="#242522" data-box="460 104 360 30.0">02  Check the file identities</text><text x="870" y="124" font-family="IBM Plex Sans" font-size="20" font-weight="600" fill="#242522" data-box="870 104 300 30.0">03  Select an exact version</text><path d="M44 163H134L156 183H410V445H44Z" fill="#e8e9e3" stroke="#242522" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="60" y="203" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#242522" data-box="60 185 310 27.0">release-v4/</text><path d="M77 222V374M77 242H105M77 290H105M77 338H105" fill="none" stroke="#60625d" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><rect x="108" y="224" width="275" height="36" rx="0" fill="#ffffff" stroke="#b6b7af" stroke-width="1.6"/><text x="122" y="248" font-family="IBM Plex Mono" font-size="17" font-weight="400" fill="#242522" data-box="122 231 245 25.5">model.bin</text><rect x="108" y="272" width="275" height="36" rx="0" fill="#ffffff" stroke="#b6b7af" stroke-width="1.6"/><text x="122" y="296" font-family="IBM Plex Mono" font-size="1