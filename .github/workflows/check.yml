name: Workshop checks
on: [push, pull_request]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - id: build-uv
        shell: bash
        run: echo "version=$(python scripts/release_support.py --uv-version)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ steps.build-uv.outputs.version }}
      - run: uv sync --frozen --all-extras
      - run: uv run --all-extras pytest -q
      - run: uv run --all-extras python scripts/build_notebooks.py
      - run: git diff --exit-code -- notebooks
      - run: uv run --all-extras marimo check notebooks/starter.py notebooks/facilitator.py notebooks/solar_autoresearch.py notebooks/pending_inc.py notebooks/request_routing.py notebooks/visual_inspection.py
  base:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        extra: [base, pending]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - id: build-uv
        shell: bash
        run: echo "version=$(python scripts/release_support.py --uv-version)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ steps.build-uv.outputs.version }}
      - if: matrix.extra == 'base'
        run: uv sync --frozen --no-dev
      - if: matrix.extra == 'pending'
        run: uv sync --frozen --no-dev --extra pending
      - run: uv run --no-sync python -c "import importlib.util; from forge_workshop_kit.manifest import list_workshops; assert len(list_workshops()) == 4; assert importlib.util.find_spec('torch') is None; assert importlib.util.find_spec('sunpy') is None"
      - run: uv run --no-sync marimo check notebooks/starter.py notebooks/facilitator.py
