name: Workshop decks
on:
  push:
    branches: [main]
    paths: ['decks/**', 'src/forge_workshop_kit/assets/visuals.json', 'scripts/build_decks.py', 'scripts/validate_deck.mjs', 'scripts/check_deck_pdf.py', 'scripts/serve_deck.py', '.github/workflows/deck.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: workshop-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            decks/solar/package-lock.json
            decks/pending/package-lock.json
            decks/routing/package-lock.json
            decks/inspection/package-lock.json
            decks/transit/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.27'
      - run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --prefix decks/solar
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --prefix decks/pending
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --prefix decks/routing
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --prefix decks/inspection
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --prefix decks/transit
          cd decks/solar
          npx playwright install --with-deps chromium
      - run: python3 scripts/build_decks.py --pdf --validate
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/decks/site
      - uses: actions/deploy-pages@v4
        id: deployment
