name: Workshop decks
on:
  push:
    branches: [main]
    paths: ['decks/**', 'skills/**', 'visual-guides/**', 'docs/**', 'next-up.md', 'reports/published.json', 'src/forge_workshop_kit/assets/visuals.json', 'src/forge_workshop_kit/assets/aria/**', 'src/forge_workshop_kit/workshops.json', 'scripts/aria_storyboard.py', 'scripts/build_aria_recordings.py', 'scripts/build_decks.py', 'scripts/build_share_packet.py', 'scripts/build_share_links.py', 'scripts/render_share_qr.mjs', 'scripts/share_storyboard.py', 'scripts/render_share_packet.mjs', 'scripts/build_visual_guides.py', 'scripts/illustrate_*.py', 'scripts/technical_guide_storyboard.py', 'scripts/scene_storyboard.py', 'scripts/validate_deck.mjs', 'scripts/check_deck_pdf.py', 'scripts/serve_deck.py', '.github/workflows/deck.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: workshop-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: decks/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.27'
      - run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --prefix decks
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --prefix skills/teenage-engineering-visualizations
          cd decks
          npx playwright install --with-deps chromium
      - run: python3 scripts/build_decks.py --pdf --validate
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/decks/site
      - uses: actions/deploy-pages@v4
        id: deployment
