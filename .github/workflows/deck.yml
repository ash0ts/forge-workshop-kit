name: Solar workshop deck
on:
  push:
    branches: [main]
    paths: ['decks/solar/**', '.github/workflows/deck.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: workshop-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: decks/solar/package-lock.json
      - run: npm ci
        working-directory: decks/solar
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run build:pages
        working-directory: decks/solar
      - run: |
          mkdir -p site/solar
          cp -R decks/solar/dist-pages/. site/solar/
          cp decks/solar/dist-pages/404.html site/404.html
          printf '<!doctype html><meta http-equiv="refresh" content="0;url=solar/">' > site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
