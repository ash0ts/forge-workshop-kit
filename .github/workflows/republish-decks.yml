name: Republish validated workshop decks
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Completed Workshop decks run with a successful validated build and Pages upload'
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: workshop-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the source build and artifact
        id: source
        uses: actions/github-script@v7
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        with:
          script: |
            const input = process.env.SOURCE_RUN_ID;
            const runId = Number(input);
            if (!/^[0-9]+$/.test(input) || !Number.isSafeInteger(runId) || runId <= 0) {
              throw new Error('source_run_id must be a positive numeric workflow run ID.');
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: runId });
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (run.repository.full_name !== repository || run.head_repository?.full_name !== repository ||
                run.path !== '.github/workflows/deck.yml' || run.head_branch !== 'main' ||
                !['push', 'workflow_dispatch'].includes(run.event) || run.status !== 'completed') {
              throw new Error('Source must be a completed Workshop decks run from main in this repository.');
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              ...context.repo, run_id: runId, attempt_number: run.run_attempt, per_page: 100,
            });
            const validated = jobs.filter((job) => job.name === 'publish').filter((job) => {
              const passed = (name) => job.steps.some((step) => step.name === name && step.conclusion === 'success');
              return passed('Run python3 scripts/build_decks.py --pdf --validate') &&
                passed('Run actions/upload-pages-artifact@v3');
            });
            if (validated.length !== 1) {
              throw new Error('The latest source attempt must have successful deck validation and Pages upload steps.');
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: runId, per_page: 100,
            });
            const matches = artifacts.filter((artifact) => artifact.name === 'github-pages' && !artifact.expired);
            if (matches.length !== 1 || matches[0].size_in_bytes <= 0) {
              throw new Error('Source must contain exactly one unexpired github-pages artifact.');
            }
            core.setOutput('artifact_id', matches[0].id);
            await core.summary.addHeading('Republish an existing build')
              .addLink(`Source run ${runId}`, run.html_url)
              .addRaw(`\n\nSource commit: ${run.head_sha}\n\nArtifact: ${matches[0].id}\n`)
              .write();
      - name: Download the validated Pages archive
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/pages-recovery
          merge-multiple: true
      - name: Check the Pages archive
        env:
          ARCHIVE: ${{ runner.temp }}/pages-recovery/artifact.tar
        run: |
          test -f "$ARCHIVE"
          tar -tf "$ARCHIVE" > /dev/null
          sha256sum "$ARCHIVE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - name: Upload the unchanged Pages archive
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-recovery/artifact.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Wait for Pages artifact metadata
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        with:
          script: |
            const { waitForPagesArtifact } = require('./.github/scripts/pages-artifact.cjs');
            await waitForPagesArtifact({ github, context, core, artifactId: process.env.PAGES_ARTIFACT_ID });
      - uses: actions/deploy-pages@v4
        id: deployment
