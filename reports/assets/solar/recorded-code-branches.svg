   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #546862" x="32.4" y="73.93125" transform="rotate(-0 32.4 73.93125)">Recorded validation experiment · 142 images · Seed 17 · 40 updates · Same parent source and data</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7c8985" x="45.36" y="129.158437" transform="rotate(-0 45.36 129.158437)">Parent from round one: residual model + absolute-error training loss</text>
   </g>
   <g id="text_4">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153d3e" x="50.4" y="165.129375" transform="rotate(-0 50.4 165.129375)">Validation error 0.120553</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4382a6" x="45.36" y="252.969375" transform="rotate(-0 45.36 252.969375)">A · Start the correction at zero</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #153d3e" transform="translate(45.36 282.01125)">Change: zero-initialize the final layer</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #153d3e" transform="translate(45.36 299.41125)">Hypothesis: stop spending early updates</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #153d3e" transform="translate(45.36 316.81125)">unlearning a random correction.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #c17b40" x="459.36" y="251.558438" transform="rotate(-0 459.36 251.558438)">B · Change the sampling order</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #153d3e" transform="translate(459.36 282.01125)">Change: sample epoch permutations</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #153d3e" transform="translate(459.36 299.41125)">Hypothesis: more uniform example coverage</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #153d3e" transform="translate(459.36 317.97375)">will reduce validation error.</text>
   </g>
