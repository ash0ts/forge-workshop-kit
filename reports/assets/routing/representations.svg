   <g id="text_2">
    <text style="font-size: 17px; font-family: 'IBM Plex Sans', 'DejaVu Sans'; text-anchor: start; fill: #526766" x="51.84" y="98.857" transform="rotate(-0 51.84 98.857)">The training messages and classifier settings stay the same.</text>
