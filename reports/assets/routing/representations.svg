   <g id="text_3">
    <text style="font-weight: 600; font-size: 18px; font-family: 'IBM Plex Sans SemiBold'; text-anchor: start; fill: #207b72" x="72.576" y="187.578" transform="rotate(-0 72.576 187.578)">Request text</text>
   </g>
   <g id="text_4">
    <text style="font-size: 17px; font-family: 'IBM Plex Sans', 'DejaVu Sans'; text-anchor: start; fill: #183a3b" x="72.576" y="229.801734" transform="rotate(-0 72.576 229.801734)">Can I get an update on my replacement card?</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 600; font-size: 20px; font-family: 'IBM Plex Sans SemiBold'; text-anchor: start; fill: #3971ae" x="72.576" y="346.228" transform="rotate(-0 72.576 346.228)">Word TF–IDF</text>
