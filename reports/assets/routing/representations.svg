   <g id="text_1">
    <text style="font-weight: 600; font-size: 26px; font-family: 'IBM Plex Sans SemiBold'; text-anchor: start; fill: #183a3b" x="51.84" y="64.234" transform="rotate(-0 51.84 64.234)">What changes when we change the representation?</text>
