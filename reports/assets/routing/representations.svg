   <g id="text_7">
    <text style="font-weight: 600; font-size: 20px; font-family: 'IBM Plex Sans SemiBold'; text-anchor: start; fill: #bc6638" x="559.872" y="346.228" transform="rotate(-0 559.872 346.228)">Frozen sentence encoder</text>
   </g>
   <g id="text_8">
