   <g id="text_2">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #546563" x="39.6" y="84.779063" transform="rotate(-0 39.6 84.779063)">Metric definitions · no invented predictions from the unavailable native judge</text>
   </g>
   <g id="text_3">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #183f3e" x="432" y="153.394687" transform="rotate(-0 432 153.394687)">Eligible turns in the frozen workshop batch</text>
   </g>
   <g id="text_4">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #183f3e" transform="translate(125.149141 285.817813)">Completed boolean predictions</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #183f3e" transform="translate(89.864062 311.467813)">Only these can be positive or negative</text>
   </g>
   <g id="text_5">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #183f3e" transform="translate(559.6875 286.216875)">Unprocessed / unavailable</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #183f3e" transform="translate(601.091719 310.516875)">No prediction yet</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #183f3e" x="46.8" y="398.112656" transform="rotate(-0 46.8 398.112656)">Coverage = completed predictions / eligible turns</text>
   </g>
   <g id="text_7">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #183f3e" x="46.8" y="461.890938" transform="rotate(-0 46.8 461.890938)">Then keep the completed predictions with reviewed human labels:</text>
   </g>
   <g id="text_8">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #183f3e" x="46.8" y="509.153672" transform="rotate(-0 46.8 509.153672)">Precision = TP / (TP + FP)       Recall = TP / (TP + FN)</text>
   </g>
   <g id="text_9">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #546563" x="46.8" y="549.347188" transform="rotate(-0 46.8 549.347188)">TP = correctly flagged issue; FP = false alarm; FN = missed reviewed issue. Empty denominators stay missing.</text>
   </g>
